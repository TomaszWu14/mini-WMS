[project]
name = "mini-wms"
version = "0.1.0"
description = "miniWMS — lekki system magazynowy (Django)."
requires-python = ">=3.11"
# US-020 / ADR-0007: jedyne źródło zależności to requirements.in (prod) i
# requirements-dev.in (dev/CI); requirements*.txt to locki z hashami (pip-compile).
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["warehouse", "config"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

# --- Ruff: lint + format (zastępuje flake8/black/isort) ---------------------
[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["warehouse/migrations", "warehouse/static/warehouse/vendor"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, C4 comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "C4", "DJ"]
ignore = [
    "E501",   # długość linii pilnuje formatter
    "DJ001",  # null=True na polach tekstowych — świadomie używane
]

[tool.ruff.lint.per-file-ignores]
"warehouse/tests.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["warehouse", "config"]

# --- mypy (opcjonalnie, warstwa serwisów) -----------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
# US-019 / kryterium 1: widoki nie mają adnotacji — bez tego mypy pomija ich ciała
# i błąd typu w widoku przechodzi CI.
check_untyped_defs = true
# Migracje generowane maszynowo; settings korzystają z gwiazdkowego importu
# (base→dev/prod), którego mypy nie śledzi — sprawdzamy logikę, nie konfigurację.
exclude = ["warehouse/migrations/", "config/settings/"]

# Settings korzystają z gwiazdkowego importu (base→dev/prod) — mypy nie śledzi
# nazw wprowadzonych przez `import *`, więc pomijamy błędy w tym module.
[[tool.mypy.overrides]]
module = "config.settings.*"
ignore_errors = true

# Testy: Optional z `.first()` / `.get()` bez zawężania to norma w asercjach —
# pełne sprawdzanie ciał dotyczy kodu aplikacji, nie testów.
[[tool.mypy.overrides]]
# mypy nie obsługuje wzorca `tests_*` — nowy plik testów dopisz do listy.
module = [
    "warehouse.tests",
    "warehouse.tests_2fa",
    "warehouse.tests_access_matrix",
    "warehouse.tests_alerts",
    "warehouse.tests_audit_log",
    "warehouse.tests_backup_script",
    "warehouse.tests_concurrency_pg",
    "warehouse.tests_db_indexes",
    "warehouse.tests_demo",
    "warehouse.tests_demo_entry",
    "warehouse.tests_demo_limits",
    "warehouse.tests_demo_tour",
    "warehouse.tests_deploy_settings",
    "warehouse.tests_imports_fixes",
    "warehouse.tests_imports_hardening",
    "warehouse.tests_input_limits",
    "warehouse.tests_input_validation",
    "warehouse.tests_login_limits",
    "warehouse.tests_open_decisions",
    "warehouse.tests_pagination",
    "warehouse.tests_passwords",
    "warehouse.tests_record_video",
    "warehouse.tests_recruiter",
    "warehouse.tests_retention",
    "warehouse.tests_scanner_fixes",
    "warehouse.tests_security",
    "warehouse.tests_security_headers",
    "warehouse.tests_services_fixes",
    "warehouse.tests_tooling",
    "warehouse.tests_urls",
    "warehouse.tests_views_fixes",
]
check_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings"

# --- pytest (uruchamia istniejące testy Django TestCase) --------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "tests_*.py", "test_*.py"]
addopts = "-p no:cacheprovider"
# WhiteNoise w testach: brak staticfiles/ (collectstatic robi tylko Docker) — szum.
filterwarnings = ["ignore:No directory at:UserWarning"]

# --- mutmut (scripts/mutate.sh; wymaga Linux/WSL — fork) --------------------
[tool.mutmut]
# scripts/mutate.sh podmienia source_paths na wskazany moduł (w kopii repo).
source_paths = ["warehouse/services.py"]
pytest_add_cli_args_test_selection = ["warehouse/"]
also_copy = ["config/", "manage.py", "warehouse/"]

# --- bandit (scripts/security_scan.sh) --------------------------------------
[tool.bandit]
exclude_dirs = ["warehouse/migrations", "warehouse/static", ".venv"]
skips = ["B101"]  # assert w testach

# --- Coverage ---------------------------------------------------------------
[tool.coverage.run]
source = ["warehouse", "config"]
# tests*.py poza pomiarem — inaczej pliki testów (zawsze ~100 %) zawyżają wynik.
omit = ["*/migrations/*", "*/tests.py", "*/tests_*.py"]

[tool.coverage.report]
# Próg z ADR-0001 (założenie Z-08): 80 % ogółem; 90 % dla warehouse/services.py
# sprawdza osobno CI (`coverage report --include=warehouse/services.py --fail-under=90`).
fail_under = 80
show_missing = true
skip_covered = false
