{% extends "warehouse/base.html" %}
{% block title %}{{ title }} — mini-WMS{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="panel form-narrow">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button class="btn" type="submit">{{ submit|default:"Zapisz" }}</button>
    <a class="btn btn-secondary" href="javascript:history.back()">Anuluj</a>
  </form>
</div>
{% endblock %}
