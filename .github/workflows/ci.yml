name: CI

# Pipeline (ADR-0001): lint → typy → testy z progiem pokrycia → SAST → SCA → skan sekretów
# → build obrazu → skan obrazu. Wyniki skanów trafiają do artefaktów (reports-*).
# Błąd wysokiej wagi blokuje pipeline; co jest doradcze — opisane przy kroku.
# Akcje przypięte do SHA (Dependabot podbija je co tydzień).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: 1. Lint i format (ruff, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalacja narzędzi (lock z hashami, US-020)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format (check)
        run: ruff format --check .
      - name: Shellcheck skryptów (US-012)
        run: shellcheck scripts/*.sh entrypoint.sh

  typecheck:
    name: 2. Typy (mypy — cały kod aplikacji)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalacja zależności
        run: pip install --require-hashes -r requirements-dev.txt
      - name: mypy
        run: mypy warehouse config

  test:
    name: 3. Testy (SQLite) + pokrycie
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalacja zależności
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Production deploy check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-placeholder-key-not-used-in-production-0123456789"
          DJANGO_ALLOWED_HOSTS: "miniwms.example.com"
          DJANGO_SECURE_COOKIES: "1"
        run: python manage.py check --deploy

      - name: Verify migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Testy z pomiarem pokrycia (pytest, config.settings.test)
        run: coverage run -m pytest -q -p no:cacheprovider

      - name: Próg pokrycia — 80 % ogółem (pyproject fail_under), 90 % warehouse/services.py
        run: |
          coverage report
          coverage report --include=warehouse/services.py --fail-under=90

      - name: Raport pokrycia (artefakt)
        if: always()
        run: |
          coverage xml -o reports/coverage.xml || true
          coverage html -d reports/htmlcov || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: reports-coverage
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  test-postgres:
    # Produkcja działa na PostgreSQL: blokady wierszy (select_for_update) i FOR UPDATE
    # na złączeniach sprawdzi tylko prawdziwy Postgres. Tu działa też
    # warehouse.tests_concurrency_pg (na SQLite jest pomijany).
    name: 3b. Testy (PostgreSQL 16)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://wms:wms@localhost:5432/wms
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalacja zależności
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Testy (pytest, PostgreSQL)
        run: pytest -q -p no:cacheprovider
      - name: "Ćwiczenie odtworzenia kopii (US-012): backup → age → off-site → odtworzenie → porównanie"
        env:
          DEMO_MODE: "1"
        run: |
          set -eu
          sudo apt-get install -y -qq age >/dev/null
          python manage.py migrate --noinput -v0
          python manage.py seed_demo
          python manage.py backup_fingerprint > before.txt
          age-keygen -o key.txt 2>/dev/null
          RECIPIENT="$(grep 'public key' key.txt | cut -d' ' -f4)"
          mkdir -p out
          # Prawdziwy skrypt backupu w obrazie PostgreSQL (jak kontener `backup`); off-site = katalog lokalny rclone.
          # Ten sam obraz co kontener `backup` (bez instalowania pakietów w trakcie testu).
          docker build -q -f docker/backup.Dockerfile -t miniwms-backup:drill . >/dev/null
          docker run --rm --network host -v "$PWD/out:/backups" \
            -e PGPASSWORD=wms -e DB_HOST=localhost -e POSTGRES_USER=wms -e POSTGRES_DB=wms \
            -e BACKUP_ONCE=1 -e BACKUP_AGE_RECIPIENT="$RECIPIENT" -e BACKUP_RCLONE_REMOTE=/backups/offsite \
            -e BACKUP_OFFSITE_PRUNE=1 miniwms-backup:drill
          ENC="$(ls out/offsite/wms-*.sql.gz.age)"
          if gunzip -t "$ENC" 2>/dev/null; then echo "kopia off-site NIE jest zaszyfrowana"; exit 1; fi
          age -d -i key.txt "$ENC" | gunzip > restore.sql
          PSQL="docker run --rm -i --network host -e PGPASSWORD=wms postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea psql -h localhost -U wms"
          $PSQL -d wms -c "CREATE DATABASE restore_test OWNER wms;"
          $PSQL -d restore_test -v ON_ERROR_STOP=1 --single-transaction -q < restore.sql
          export DATABASE_URL="${DATABASE_URL%/wms}/restore_test"
          python manage.py check
          if python manage.py showmigrations --plan | grep -F "[ ]"; then echo "niezastosowane migracje po odtworzeniu"; exit 1; fi
          python manage.py backup_fingerprint > after.txt
          diff before.txt after.txt
          echo "Odtworzenie zgodne z danymi przed backupem:"; cat after.txt

  sast:
    name: 4. SAST (bandit, semgrep)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalacja skanerów
        run: |
          pip install --require-hashes -r requirements-dev.txt
          # semgrep: osobny lock z hashami i osobny venv (konflikt tomli z pip-audit; US-020).
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --require-hashes -r requirements-semgrep.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: Bandit (blokuje przy waga ≥ średnia i pewność ≥ średnia)
        run: |
          mkdir -p reports
          bandit -c pyproject.toml -r warehouse config manage.py -ll -ii -f json -o reports/bandit.json || status=$?
          bandit -c pyproject.toml -r warehouse config manage.py -ll -ii -q
          exit "${status:-0}"

      - name: Semgrep — reguły OWASP Top 10 i Django (blokuje przy ERROR)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          # Zakres jak bandit: kod aplikacji. Narzędzia deweloperskie (.claude/hooks, tools/)
          # skanuje doradczo security.yml — ich zgłoszenia (subprocess bez stałego polecenia)
          # nie dotyczą środowiska produkcyjnego.
          semgrep scan --config p/owasp-top-ten --config p/django \
            --severity ERROR --error --sarif --output reports/semgrep.sarif \
            --exclude warehouse/static/warehouse/vendor \
            warehouse config manage.py || status=$?
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("reports/semgrep.sarif")
          if p.exists():
              runs = json.loads(p.read_text()).get("runs", [])
              results = [r for run in runs for r in run.get("results", [])]
              print(f"semgrep: {len(results)} ustaleń ERROR")
              for r in results:
                  loc = r["locations"][0]["physicalLocation"]
                  print(f"- {loc['artifactLocation']['uri']}:{loc['region']['startLine']} {r['ruleId']}: {r['message']['text'][:160]}")
          PY
          exit "${status:-0}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: reports-sast
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  sca:
    name: 5. SCA (pip-audit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalacja pip-audit
        run: pip install --require-hashes -r requirements-dev.txt

      - name: pip-audit — zależności produkcyjne (blokuje przy znanej podatności)
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt --progress-spinner off --desc on \
            -f json -o reports/pip-audit-prod.json || status=$?
          python -m json.tool reports/pip-audit-prod.json | head -80 || true
          exit "${status:-0}"

      - name: pip-audit — zależności deweloperskie (doradczo)
        continue-on-error: true
        run: |
          pip-audit -r requirements-dev.txt --progress-spinner off --desc on \
            -f json -o reports/pip-audit-dev.json || status=$?
          python -m json.tool reports/pip-audit-dev.json | head -80 || true
          if [ "${status:-0}" != "0" ]; then
            echo "::warning::pip-audit znalazł podatności w zależnościach deweloperskich — patrz artefakt reports-sca"
          fi
          exit "${status:-0}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: reports-sca
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    name: 6. Skan sekretów (gitleaks, pełna historia)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    # Buduje obraz produkcyjny tak jak Coolify, URUCHAMIA go (kontener musi być „healthy")
    # i skanuje obraz Trivy: podatności HIGH/CRITICAL z dostępną poprawką blokują,
    # błędy konfiguracji (Dockerfile, compose) są raportowane doradczo.
    name: 7. Build obrazu, smoke test i skan obrazu (trivy)
    needs: [test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build image
        run: |
          mkdir -p reports
          docker build -t miniwms:ci .
          # US-012: obraz kontenera backupu (age, rclone, curl) i jego narzędzia.
          docker build -f docker/backup.Dockerfile -t miniwms-backup:ci .
          docker run --rm --entrypoint sh miniwms-backup:ci -c "age --version && rclone version | head -1 && curl --version | head -1 && pg_dump --version"

      - name: Compose (wariant prywatny) odmawia startu bez sekretów — US-003
        run: |
          for v in DJANGO_SECRET_KEY DJANGO_SUPERUSER_PASSWORD POSTGRES_PASSWORD; do
            if ( export DJANGO_SECRET_KEY=x DJANGO_SUPERUSER_PASSWORD=x POSTGRES_PASSWORD=x
                 unset "$v"; docker compose -f docker-compose.yml config >/dev/null 2>compose.err ); then
              echo "::error::compose przyjął konfigurację bez $v"; exit 1
            fi
            grep -q "required variable $v is missing" compose.err || { cat compose.err; exit 1; }
            echo "OK: brak $v zatrzymuje compose"
          done

      - name: Smoke test — kontener wstaje i jest healthy
        run: |
          docker run -d --name miniwms-ci \
            -e DJANGO_SECRET_KEY=ci-smoke-key-not-for-production-0123456789-abcdefghij \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            miniwms:ci
          status=starting
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' miniwms-ci 2>/dev/null || echo missing)
            echo "health=$status"
            case "$status" in healthy|unhealthy) break;; esac
            sleep 3
          done
          echo "--- logi kontenera ---"; docker logs miniwms-ci | tail -30
          docker rm -f miniwms-ci >/dev/null 2>&1 || true
          test "$status" = "healthy"

      - name: "Trivy — podatności w obrazie (blokuje: HIGH/CRITICAL z poprawką)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: miniwms:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: "Trivy — obraz kontenera backupu (US-012; blokuje: HIGH/CRITICAL z poprawką)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: miniwms-backup:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Trivy — raport SARIF z obrazu (artefakt)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: miniwms:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: reports/trivy-image.sarif
          skip-setup-trivy: true

      - name: Trivy — konfiguracja (Dockerfile, compose; doradczo)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          skip-setup-trivy: true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: reports-image
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
