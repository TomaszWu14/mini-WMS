name: security

# Cotygodniowy, szerszy i DORADCZY skan bezpieczeństwa (ADR-0001). Blokujące wersje
# tych samych kontroli działają przy każdym pushu i PR w ci.yml. Tu: pełna historia gita
# (gitleaks), system plików i konfiguracja (trivy — wszystkie poziomy), semgrep z szerszym
# zestawem reguł, pip-audit także dla zależności deweloperskich, bandit na wszystkich
# poziomach. Wyniki jako artefakty (30 dni). Repozytorium jest publiczne — minuty Actions
# są bezpłatne, więc harmonogram tygodniowy zamiast miesięcznego.

on:
  schedule:
    - cron: "0 6 * * 1"   # poniedziałek 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  gitleaks:
    name: gitleaks (sekrety, pełna historia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: trivy (zależności, sekrety, konfiguracja — raport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: mkdir -p reports
      - name: Skan repozytorium (tabela w logu, wszystkie poziomy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "0"
          format: table
      - name: Skan repozytorium (SARIF do artefaktu)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "0"
          format: sarif
          output: reports/trivy-fs.sarif
          skip-setup-trivy: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: weekly-trivy
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  semgrep:
    name: semgrep (szerszy zestaw reguł — raport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install semgrep==1.146.0
      - name: Semgrep (python, django, owasp, security-audit, secrets — wszystkie poziomy)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          mkdir -p reports
          semgrep scan --config p/python --config p/django --config p/owasp-top-ten \
            --config p/security-audit --config p/secrets \
            --exclude warehouse/static/warehouse/vendor \
            --sarif --output reports/semgrep-weekly.sarif . || true
          semgrep scan --config p/python --config p/django --config p/owasp-top-ten \
            --config p/security-audit --config p/secrets \
            --exclude warehouse/static/warehouse/vendor . || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: weekly-semgrep
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  deps-and-sast:
    name: pip-audit (prod + dev) i bandit (wszystkie poziomy — raport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: pip-audit requirements*.txt
        run: |
          mkdir -p reports
          for f in requirements.txt requirements-dev.txt; do
            echo "── $f ──"
            pip-audit -r "$f" --progress-spinner off --desc on -f json -o "reports/pip-audit-$(basename "$f" .txt).json" || true
            pip-audit -r "$f" --progress-spinner off || true
          done
      - name: bandit (wszystkie poziomy, raport)
        run: |
          bandit -c pyproject.toml -r warehouse config manage.py -f json -o reports/bandit-full.json || true
          bandit -c pyproject.toml -r warehouse config manage.py -q || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: weekly-deps-sast
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
