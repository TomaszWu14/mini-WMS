# mini-WMS — wariant dla Coolify.
#
# W Coolify NIE używamy własnego Caddy — Coolify ma wbudowany reverse-proxy
# (Traefik) z automatycznym certyfikatem SSL (Let's Encrypt). Wystarczy, że
# usługa `web` wystawia port 8000 wewnętrznie, a Coolify podłączy do niej domenę.
#
# Magiczna zmienna SERVICE_FQDN_WEB_8000 mówi Coolify: wystaw usługę `web`
# (port 8000) na świat pod wygenerowaną/ustawioną domeną i obsłuż HTTPS.
# Domenę możesz też ustawić ręcznie w panelu Coolify (zakładka Domains).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # --- Coolify: domena + automatyczny HTTPS ---
      SERVICE_FQDN_WEB_8000: ${SERVICE_FQDN_WEB_8000:-/}
      # --- Django ---
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?ustaw DJANGO_SECRET_KEY w Coolify}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-miniwms.example.com}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-1}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Warsaw}
      # Jedno proxy (Traefik Coolify) — IP klienta z ostatniego wpisu X-Forwarded-For.
      DJANGO_TRUSTED_PROXY_COUNT: ${DJANGO_TRUSTED_PROXY_COUNT:-1}
      # Publiczna instancja demo: DEMO_MODE=1 (baner, loginy demo).
      DEMO_MODE: ${DEMO_MODE:-0}
      # Konto dla „Wejdź jako demo” i hasło kont demo (publiczne, opisane w README).
      DEMO_USER: ${DEMO_USER:-demo_operator}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      DATABASE_URL: postgres://${POSTGRES_USER:-wms}:${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wms}
      # Konto administratora tworzone automatycznie przy pierwszym starcie:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?ustaw DJANGO_SUPERUSER_PASSWORD}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wms}
      POSTGRES_USER: ${POSTGRES_USER:-wms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Automatyczny backup bazy (US-012): pg_dump -> gzip lokalnie, szyfrowana kopia (age)
  # poza serwerem (rclone), heartbeat. Konfiguracja: COOLIFY.md §10.
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-wms}
      POSTGRES_DB: ${POSTGRES_DB:-wms}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      # Off-site (puste = tylko kopia lokalna). Klucz PUBLICZNY age; prywatny offline u PO.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-30}
      # 1 = skrypt usuwa stare kopie off-site (klucz z prawem usuwania); 0 = lifecycle bucketu.
      BACKUP_OFFSITE_PRUNE: ${BACKUP_OFFSITE_PRUNE:-0}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      # Zdalny cel rclone wyłącznie ze zmiennych (przykład S3 — COOLIFY.md §10).
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_HOST: ${RCLONE_CONFIG_OFFSITE_HOST:-}
      RCLONE_CONFIG_OFFSITE_USER: ${RCLONE_CONFIG_OFFSITE_USER:-}
      RCLONE_CONFIG_OFFSITE_PASS: ${RCLONE_CONFIG_OFFSITE_PASS:-}
    volumes:
      - db_backups:/backups

volumes:
  db_data:
  db_backups:
